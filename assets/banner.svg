<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" style="background: #090d16; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1020" />
      <stop offset="50%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="glowPurple" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="70%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="80%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#c4b5fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <style>
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatCard3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.08); }
      }
      @keyframes dashAnim {
        from { stroke-dashoffset: 60; }
        to { stroke-dashoffset: 0; }
      }
      .anim-card1 { animation: floatCard1 5s ease-in-out infinite; }
      .anim-card2 { animation: floatCard2 6s ease-in-out infinite 1s; }
      .anim-card3 { animation: floatCard3 5.5s ease-in-out infinite 2s; }
      .anim-glow { animation: pulseGlow 7s ease-in-out infinite alternate; }
      .grid-line { stroke: #1e293b; stroke-opacity: 0.35; stroke-width: 1; }
      .conn-line { stroke: #6366f1; stroke-opacity: 0.4; stroke-width: 2; stroke-dasharray: 6 6; animation: dashAnim 4s linear infinite; }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="12" />

  <!-- Animated Glowing Atmosphere -->
  <circle class="anim-glow" cx="250" cy="140" r="280" fill="url(#glowPurple)" />
  <circle class="anim-glow" cx="950" cy="220" r="300" fill="url(#glowCyan)" />
  <circle class="anim-glow" cx="700" cy="70" r="220" fill="url(#glowEmerald)" />

  <!-- Grid Blueprint Pattern Background -->
  <g>
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="0" y1="350" x2="1200" y2="350" class="grid-line" />
    <line x1="150" y1="0" x2="150" y2="420" class="grid-line" />
    <line x1="350" y1="0" x2="350" y2="420" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="420" class="grid-line" />
    <line x1="850" y1="0" x2="850" y2="420" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="420" class="grid-line" />
  </g>

  <!-- Dynamic Commerce Architecture Cards (Subtle Background Elements) -->
  <line x1="720" y1="120" x2="900" y2="120" class="conn-line" />
  <line x1="900" y1="120" x2="980" y2="250" class="conn-line" />

  <!-- Card 1: Headless API Engine -->
  <g class="anim-card1" transform="translate(680, 80)">
    <rect width="180" height="74" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2" />
    <circle cx="26" cy="37" r="14" fill="#0369a1" fill-opacity="0.5" />
    <text x="26" y="42" font-size="14" fill="#38bdf8" text-anchor="middle">⚡</text>
    <text x="50" y="32" font-size="13" font-weight="700" fill="#f8fafc">Headless API</text>
    <text x="50" y="50" font-size="11" fill="#94a3b8">GraphQL &amp; REST</text>
  </g>

  <!-- Card 2: Storefront UI -->
  <g class="anim-card2" transform="translate(900, 190)">
    <rect width="210" height="74" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.2" />
    <circle cx="26" cy="37" r="14" fill="#6b21a8" fill-opacity="0.5" />
    <text x="26" y="42" font-size="14" fill="#c084fc" text-anchor="middle">🛒</text>
    <text x="50" y="32" font-size="13" font-weight="700" fill="#f8fafc">Modern Storefront</text>
    <text x="50" y="50" font-size="11" fill="#94a3b8">Next.js • Nuxt • React</text>
  </g>

  <!-- Card 3: 0% GMV Fee / Self-Hosted -->
  <g class="anim-card3" transform="translate(740, 280)">
    <rect width="200" height="70" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.2" />
    <circle cx="26" cy="35" r="14" fill="#065f46" fill-opacity="0.5" />
    <text x="26" y="40" font-size="14" fill="#34d399" text-anchor="middle">🚀</text>
    <text x="50" y="30" font-size="13" font-weight="700" fill="#f8fafc">Self-Hosted Freedom</text>
    <text x="50" y="48" font-size="11" fill="#94a3b8">Zero Platform Revenue Tax</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (High contrast, clearly legible) -->
  <!-- Tag Pill -->
  <g transform="translate(70, 65)">
    <rect width="290" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="16" cy="16" r="5" fill="#22c55e" />
    <text x="30" y="21" font-size="12" font-weight="700" fill="#c7d2fe" letter-spacing="1">CURATED COMMERCE ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="70" y="150" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1">Awesome Storefront Builder</text>

  <!-- Subtitle -->
  <text x="70" y="195" font-size="20" font-weight="500" fill="#e2e8f0">E-Commerce Platforms &amp; Headless Storefront Engines</text>
  <text x="70" y="228" font-size="14" font-weight="400" fill="#94a3b8">SaaS Giants • Headless Open-Source • Zero Transaction Fee Alternatives</text>

  <!-- Feature Pills -->
  <g transform="translate(70, 275)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="65" y="22" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">🛍️ SaaS Leaders</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(142, 0)">
      <rect width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="82" y="22" font-size="13" font-weight="600" fill="#a855f7" text-anchor="middle">🔓 Open-Source Power</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(319, 0)">
      <rect width="155" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="77" y="22" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">⚡ Headless APIS</text>
    </g>
  </g>

  <!-- Bottom Stats Footer -->
  <g transform="translate(70, 360)">
    <text x="0" y="0" font-size="12" fill="#64748b">Verified Data: <tspan fill="#94a3b8" font-weight="600">Starting Tier Pricing • Free Trial Limits • Company Valuations • Real-time Stars</tspan></text>
  </g>
</svg>
